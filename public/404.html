<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b1830" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/me.jpg" />
    <title>404 - Nathaniel Richards</title>
    <style>
      :root {
        --bg: #0b1830;
        --heading: #e6f1ff;
        --body: #8892b0;
        --accent: #fecc67;
        --line: #233554;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        background-color: var(--bg);
        color: var(--body);
        font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.6;
      }
      main {
        max-width: 520px;
      }
      .code {
        font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        color: var(--accent);
        font-size: 14px;
        letter-spacing: 0.08em;
        margin: 0 0 16px;
      }
      h1 {
        color: var(--heading);
        font-size: clamp(36px, 8vw, 64px);
        line-height: 1.05;
        margin: 0 0 16px;
      }
      p {
        margin: 0 0 32px;
      }
      a {
        font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
        display: inline-block;
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--accent);
        border-radius: 4px;
        padding: 14px 24px;
        font-size: 14px;
        transition: background-color 0.2s ease-in-out;
      }
      a:hover,
      a:focus-visible {
        background-color: rgba(254, 204, 103, 0.12);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 - Page not found</p>
      <h1>This page doesn't exist.</h1>
      <p>The link may be broken, or the page may have moved.</p>
      <a href="/">Go home</a>
    </main>
  </body>
</html>
